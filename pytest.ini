[pytest]
pythonpath = backend
testpaths = tests/backend
asyncio_mode = auto
markers =
    slow: 実モデル(demucs-onnx/beat-this)のダウンロード・推論を伴う、比較的時間のかかるテスト
# デフォルトの `pytest` 実行では slow を除外する(ネットワーク遮断環境での予期しない
# モデルダウンロードや、ローカルでの高速反復を妨げないため)。CI では明示的に
# `pytest -m slow` を別ステップとして実行し、実モデルの配管検証を担保する。
addopts = -m "not slow"
